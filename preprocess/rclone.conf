# rclone remote for the LINZ open data buckets used by download_nz.sh.
#
# Both buckets are public (AWS Open Data). There is deliberately no
# access_key_id / secret_access_key here: with no credentials rclone issues
# anonymous, unsigned requests, which is what these buckets expect.
#
# Do not add credentials to this file - it is committed to the repository.

[nz]
type = s3
provider = AWS
region = ap-southeast-2
