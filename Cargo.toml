[package]
name = "bevy_terrain"
description = "Terrain Rendering for the Bevy Engine."
version = "0.1.0-dev"
license = "MIT OR Apache-2.0"
edition = "2024"
categories = ["game-engines", "rendering", "graphics"]
keywords = ["gamedev", "graphics", "bevy", "terrain"]
exclude = ["assets/*"]
readme = "README.md"
authors = ["Kurt Kühnert <kurt@kuehnert.dev>"]
repository = "https://github.com/kurtkuehnert/bevy_terrain"

[workspace]
members = ["preprocess"]

[features]
rand = ["dep:rand"]
metal_capture = ["dep:objc2", "dep:objc2-foundation", "dep:objc2-metal", "dep:wgpu-core"]

[lints.rust]
# The AsBindGroup derive expands to cfg(feature = "webgpu"), which is a feature of
# bevy_render rather than one of ours, so the check would flag every use of it.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("webgpu"))'] }

[dependencies]
bevy = "0.19.1"
bevy_common_assets = { version = "0.17.0", features = ["ron"] }
big_space = { git = "https://github.com/aevyrie/big_space", rev = "5f255228e9b4", features = ["i32"] } # bevy-0.19 branch, unreleased
tiff = "0.10"
bytemuck = "1.14"
ndarray = "0.16.1"
itertools = "0.14.0"
bitflags = "2.4"
indexmap = "2"
serde = "1.0.210"
ron = "0.12"
async-channel = "2.1"
slab = "0.4.9"
strum = "0.27.1"
strum_macros = "0.27.1"

rand = { version = "0.9.0", optional = true }
objc2 = { version = "0.6", optional = true }
objc2-foundation = { version = "0.3", optional = true, features = ["NSString", "NSURL"] }
objc2-metal = { version = "0.3", optional = true, features = ["MTLCaptureManager"] } # keep in sync with bevy's wgpu
wgpu-core = { version = "29", optional = true } # keep in sync with bevy's wgpu

[dev-dependencies]
# Only the examples need these, so they are not forced on users of the library. Cargo
# unifies the features into the bevy above when building examples. The dev tools are for
# the fps overlay; jpeg is for the carriage model's textures, examples/spherical/plugins/trains.rs,
# which Bevy's default image formats leave out.
bevy = { version = "0.19.1", features = ["bevy_dev_tools", "jpeg"] }
# For the overlay's copy button.
arboard = "3.6"
# The rail editor's move gizmo, examples/spherical/plugins/rail_editor/move_gizmo.rs. 0.11 is the
# release built against Bevy 0.19.
transform-gizmo-bevy = "0.11"
# The live train positions, examples/spherical/plugins/live_trains/feed.rs: the fetch, and
# the JSON it returns. ureq's defaults are rustls with ring and the webpki roots, so nothing
# of the system's. serde_json is in the tree already through bevy_gltf; serde is a dependency
# above without derive, which the feed's structs want.
ureq = "3.4"
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1"

[[example]]
name = "spherical"
path = "examples/spherical/spherical.rs"

[[example]]
name = "precision_demo"
path = "examples/precision/precision_demo.rs"
required-features = ["rand"]
